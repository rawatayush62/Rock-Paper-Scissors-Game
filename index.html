<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rock-Paper-Scissors</title>
    <link rel="stylesheet" href="./style.css">
</head>
<body>
    <div id="title-bar">
        <h1>Rock-Paper-Scissors</h1>
    </div>

    <div id="main-section-container">
        <div id="choices">
            <div id="rock" class="choice"><img src="./rock.png" alt="rock"></div>
            <div id="paper" class="choice"><img src="./paper.png" alt="paper"></div>
            <div id="scissors" class="choice"><img src="./scissors.png" alt="scissors"></div>
        </div>
    </div>

    <div id="scorecard">
        <div id="user-score">
            <h3>You</h3>
            <p id="uScore">0</p>
        </div>
        <div id="comp-score">
            <h3>Computer</h3>
            <p id="cScore">0</p>
        </div>
    </div>

    <div id="result-container">
        <div id="result">
            <h3>Let's Play</h3>
        </div>
    </div>

    <script src="./script.js"></script>
</body>
</html>
